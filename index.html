:root {
  color-scheme: light;
  --bg: #f4ecec;
  --surface: #ffffff;
  --surface-2: #faf4f4;
  --ink: #241e1f;
  --muted: #6b5d5e;
  --faint: #978788;
  --line: #e7d8d8;
  --wine: #6b1d24;
  --rose: #a63a40;
  --gold: #9a7428;
  --gold-soft: #f6ead0;
  --gold-line: #c9a35b;
  --tick-ink: #ffffff;
  --sans: "Source Sans 3", "Source Sans Pro", "Segoe UI", system-ui, -apple-system, sans-serif;
  --serif: "Source Serif 4", "Source Serif Pro", Georgia, "Times New Roman", serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #160d0f;
    --surface: #21151a;
    --surface-2: #2a1b21;
    --ink: #f4e9ea;
    --muted: #c9b4b6;
    --faint: #9a8587;
    --line: #3b2a2f;
    --wine: #f0b4b9;
    --rose: #f2939b;
    --gold: #e2bf74;
    --gold-soft: #3a2e1a;
    --gold-line: #c9a35b;
    --tick-ink: #21151a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #160d0f;
  --surface: #21151a;
  --surface-2: #2a1b21;
  --ink: #f4e9ea;
  --muted: #c9b4b6;
  --faint: #9a8587;
  --line: #3b2a2f;
  --wine: #f0b4b9;
  --rose: #f2939b;
  --gold: #e2bf74;
  --gold-soft: #3a2e1a;
  --gold-line: #c9a35b;
  --tick-ink: #21151a;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 120px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.45;
  font-variant-numeric: tabular-nums;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--surface);
}
a { color: inherit; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }

/* Kopfzeile */
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.top-inner { max-width: 720px; margin: 0 auto; padding: 10px 16px 0; }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.date-btn {
  position: relative;
  display: inline-flex; align-items: baseline; gap: 6px;

.tabs { display: flex; gap: 4px; }

}
.tabs { gap: 2px; }
@media (max-width: 420px) { .date-btn small { display: none; } .date-btn { font-size: 17px; } .tab { padding: 6px 5px; font-size: 13.5px; } .top-row { gap: 4px; } }
.tab[aria-current="page"] { color: var(--wine); background: var(--surface-2); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 10px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips[hidden] { display: none; }
.chip {

}

/* Hauptbereich */
main { max-width: 720px; margin: 0 auto; padding: 18px 16px 120px; }

.wo-title { display: flex; align-items: center; gap: 10px; }
.wo-title h1 { flex: 1; min-width: 0; }
.wo-head.compact h1 { font-size: 24px; }
.view-switch { flex: none; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--wine); display: grid; place-items: center; cursor: pointer; padding: 0; }

.f-hint { margin: 10px 0 0; font-size: 14px; color: var(--muted); }
.f-hint b { color: var(--rose); font-weight: 600; font-size: 15px; }
.f-cuedet { margin: 12px 0 0; }
.f-cuedet summary { cursor: pointer; font-size: 14px; color: var(--muted); padding: 2px 0; }

.banner {
  margin: 14px 0 0; padding: 10px 12px; border-radius: 10px;

}
.banner p { margin: 0; }
.free { margin: 18px 0 0; }
.free p { margin: 0 0 10px; color: var(--muted); }
.free-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 6px 0 14px; }
.free-btn { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; min-height: 72px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.free-btn b { font-size: 17px; color: var(--wine); }
.free-btn span { font-size: 14px; color: var(--muted); }
.free .free-note { font-size: 14px; color: var(--faint); }

/* Gruppen: gleiche Nummer = im Wechsel */
.group {
  display: grid; grid-template-columns: 46px 1fr;
  margin: 18px 0 0; background: var(--surface);
  border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
}
.group-num {
  font-family: var(--serif); font-weight: 700; font-size: 40px; line-height: 1;

}
.group-num span { display: block; font-family: var(--sans); font-weight: 600; font-size: 11px; color: var(--faint); margin-top: 6px; line-height: 1.2; padding: 0 3px; }
.group-body { min-width: 0; }
.ex { padding: 14px 14px 12px; }
.ex + .ex { border-top: 1px solid var(--line); }
.ex-head { display: flex; align-items: baseline; gap: 8px; }
.ex-tag { font-weight: 700; color: var(--rose); font-size: 15px; flex: none; }
.ex h2 { margin: 0; font-size: 18px; font-weight: 700; line-height: 1.25; }

.muscles { margin: 2px 0 0; font-size: 13px; color: var(--faint); }
.target { margin: 8px 0 0; font-size: 15px; color: var(--muted); }
.target strong { font-size: 19px; color: var(--ink); font-weight: 700; margin-right: 6px; }
.cue { margin: 6px 0 0; font-size: 15px; color: var(--muted); }
.last { margin: 10px 0 0; font-size: 14px; color: var(--muted); }
.last b { color: var(--ink); font-weight: 600; }
.hint { margin: 4px 0 0; font-size: 15px; font-weight: 600; color: var(--rose); }
.stall { margin: 8px 0 0; padding: 8px 10px; border-radius: 8px; background: var(--gold-soft); font-size: 14px; }
.mode { display: inline-flex; margin: 10px 0 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.mode button { border: 0; background: var(--surface); padding: 5px 12px; font-size: 14px; cursor: pointer; color: var(--muted); }
.mode button[aria-pressed="true"] { background: var(--surface-2); color: var(--wine); font-weight: 700; }

/* Sätze */
.sets { list-style: none; margin: 10px 0 0; padding: 0; }
.set {
  display: grid; grid-template-columns: 30px 1fr 1fr 48px; gap: 8px; align-items: center;
  padding: 5px 6px 5px 4px; border-radius: 10px; border-left: 3px solid transparent;
}
.set.one { grid-template-columns: 30px 1fr 48px; }
.set.next { background: var(--gold-soft); border-left-color: var(--gold-line); }
.set-n { text-align: center; font-weight: 700; color: var(--faint); font-size: 14px; }
.set-n.x { font-size: 11px; line-height: 1.1; }
.fld {
  display: flex; align-items: baseline; gap: 4px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
  padding: 0 8px; min-height: 44px;
}
.fld:focus-within { border-color: var(--rose); }
.fld input {
  width: 100%; min-width: 0; border: 0; background: transparent; outline: none;
  font-size: 19px; font-weight: 600; padding: 9px 0; text-align: right;
}
.fld input::placeholder { color: var(--faint); font-weight: 400; opacity: 1; }
.fld span { font-size: 13px; color: var(--faint); white-space: nowrap; }
.tick {
  width: 44px; height: 44px; border-radius: 50%;
  border: 1.5px solid var(--line); background: var(--surface);
  display: grid; place-items: center; cursor: pointer; color: var(--faint); padding: 0;
}
.tick svg { width: 20px; height: 20px; }
.tick[aria-pressed="true"] { background: var(--wine); border-color: var(--wine); color: var(--tick-ink); }
.set-tools { display: flex; gap: 14px; margin: 6px 0 0 34px; }
.linkish { background: none; border: 0; padding: 4px 0; cursor: pointer; font-size: 14px; color: var(--rose); font-weight: 600; }
.linkish.pain { color: var(--muted); }
.linkish.pain[aria-pressed="true"] { color: var(--gold); background: var(--gold-soft); border-radius: 8px; padding: 4px 10px; }
.f-pain { margin: 6px 0 0; text-align: center; }
.f-notes { margin: 14px 0 0; }
.f-lastnote { margin: 0 0 6px; font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; white-space: pre-line; }
.f-lastnote.open { display: block; }
.f-note { width: 100%; min-height: 48px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 16px; resize: none; overflow: hidden; display: block; }
.f-note:focus { border-color: var(--rose); outline: none; }

.f-icons { display: flex; gap: 8px; margin: 8px 0 0; }
.f-icon { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 18px; display: grid; place-items: center; cursor: pointer; padding: 0; }
.f-icon svg { width: 20px; height: 20px; }
.f-icon[aria-expanded="true"] { color: var(--wine); border-color: var(--wine); }
.f-icon-pain { filter: grayscale(1); opacity: 0.7; }
.f-icon-pain[aria-pressed="true"] { filter: none; opacity: 1; background: var(--gold-soft); border-color: var(--gold-line); }
.f-hist { margin: 8px 0 0; }
.hist-note { display: block; font-size: 13px; color: var(--faint); margin: 2px 0 4px; }
.f-arrows { margin-left: auto; display: flex; gap: 8px; align-self: center; }
.f-arrow { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--wine); font-size: 26px; line-height: 1; cursor: pointer; padding: 0 0 3px; }
.f-arrow:disabled { opacity: 0.3; cursor: default; }
.f-open { font-size: 13px; padding: 0; }
.f-wrapnote { margin: 8px 0 0; padding: 6px 10px; border-radius: 8px; background: var(--gold-soft); font-size: 14px; }
.f-openlist { display: grid; gap: 8px; margin: 12px 0 12px; }
.f-openitem { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); cursor: pointer; }
.f-openitem b { font-size: 15px; color: var(--ink); }
.f-openitem span { font-size: 13px; color: var(--muted); }
.hold { margin: 12px 0 0; padding: 12px; border-radius: 12px; background: var(--surface-2); text-align: center; }
.hold-lab { margin: 0; font-size: 14px; color: var(--muted); font-weight: 600; }
.hold-time { font-family: var(--serif); font-weight: 700; font-size: 44px; line-height: 1.1; color: var(--wine); min-height: 8px; }
.hold-btn { margin: 8px 0 0; min-height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 16px; color: var(--wine); cursor: pointer; }
.rir { margin: 12px 0 0; }
.rir p { margin: 0 0 6px; font-size: 13px; color: var(--faint); }
.rir-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.rir-btns button { min-height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 17px; font-weight: 700; color: var(--muted); cursor: pointer; }
.rir-btns button[aria-pressed="true"] { background: var(--wine); border-color: var(--wine); color: var(--surface); }
.more { margin: 8px 0 0; }
.more summary { cursor: pointer; font-size: 14px; color: var(--muted); padding: 4px 0; }
.more textarea {
  width: 100%; min-height: 60px; margin: 6px 0 0; padding: 8px 10px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--surface); resize: vertical; font-size: 16px;
}
.lastnote { margin: 6px 0 0; font-size: 14px; color: var(--muted); }
.hist { list-style: none; margin: 8px 0 0; padding: 0; font-size: 14px; color: var(--muted); }
.hist li { padding: 3px 0; }
.hist b { color: var(--ink); font-weight: 600; }

/* Verlauf */
.h-title { font-family: var(--serif); font-weight: 700; font-size: 30px; color: var(--wine); margin: 0; }
.h-empty { color: var(--muted); }
.h-month { margin: 22px 0 6px; font-size: 14px; font-weight: 700; color: var(--faint); }
.h-item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin: 0 0 8px; }
.h-item summary { list-style: none; cursor: pointer; padding: 12px 14px; display: flex; justify-content: space-between; gap: 10px; }
.h-item summary::-webkit-details-marker { display: none; }
.h-item summary b { font-weight: 700; }
.h-item summary span { color: var(--faint); font-size: 14px; white-space: nowrap; }
.h-body { padding: 0 14px 12px; font-size: 14px; color: var(--muted); }
.h-body p { margin: 4px 0; }
.h-body b { color: var(--ink); font-weight: 600; }
.wbox { margin: 16px 0 0; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.wbox .wh { margin: 0 0 6px; font-size: 17px; font-weight: 700; color: var(--ink); }
.wbox p { margin: 0 0 6px; color: var(--muted); font-size: 15px; }
.wbox .wsub { font-size: 13px; color: var(--faint); }
.wrow { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin: 8px 0 0; }
.wfld input { font-size: 24px; }
.wsave { margin: 0; min-height: 48px; padding: 0 18px; width: auto; }
.wadv { border-left: 4px solid var(--line); }
.wadv-ok { border-left-color: var(--gold-line); }
.wadv-more, .wadv-less { border-left-color: var(--rose); }
.wadv .wh { font-family: var(--serif); font-size: 22px; color: var(--wine); }
.wgoal { font-size: 13px !important; color: var(--faint) !important; }
.wfacts { font-size: 14px !important; }
.wtip { padding: 8px 10px; border-radius: 8px; background: var(--gold-soft); color: var(--ink) !important; font-size: 14px !important; }
.wchart { display: block; width: 100%; height: auto; margin: 10px 0 2px; }
.wchart .wgrid { stroke: var(--line); stroke-width: 1; }
.wchart .wlabel { fill: var(--faint); font-size: 10px; font-family: var(--sans); }
.wchart .wavg { fill: none; stroke: var(--wine); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.wchart .wdot { fill: var(--gold-line); }
.wlegend { font-size: 12px !important; color: var(--faint) !important; }
.wuntil { display: flex; align-items: center; gap: 8px; margin: 12px 0 4px; font-size: 15px; color: var(--muted); }
.wuntil input { font-size: 16px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.wlist { list-style: none; margin: 0; padding: 0; }
.wlist li { display: grid; grid-template-columns: 1fr auto 28px; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 15px; color: var(--muted); }
.wlist li:first-child { border-top: 0; }
.wlist b { color: var(--ink); font-weight: 600; }
.backup { margin: 26px 0 0; }
.backup p { margin: 0 0 8px; color: var(--muted); font-size: 15px; }
.backup .backup-last { color: var(--faint); font-size: 14px; }
.backup-btns { display: grid; gap: 10px; margin: 8px 0 0; }
.backup-btns .f-done { margin: 0; }
.backup-load { display: flex; align-items: center; justify-content: center; min-height: 52px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); font-weight: 700; color: var(--wine); cursor: pointer; }
.backup-load input { display: none; }

/* Fußleiste: was als Nächstes kommt */
.next-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
}
.next-inner { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.next-btn { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; }
.next-label { display: block; font-size: 13px; color: var(--faint); }
.next-what { display: block; font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.next-rest { display: block; font-size: 13px; color: var(--muted); }
.timer { font-family: var(--serif); font-weight: 700; font-size: 26px; color: var(--wine); min-width: 64px; text-align: right; }
.next-bar[hidden] { display: none; }

/* Ansicht wählen */
.seg { display: inline-flex; margin: 12px 0 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 7px 14px; font-weight: 600; font-size: 14px; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--wine); color: var(--surface); }

/* Schritt für Schritt */
.focus { margin: 16px 0 0; }
.f-progress { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--faint); }
.f-bar, .rest-bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.f-bar i, .rest-bar i { display: block; height: 100%; background: var(--gold-line); }
.f-card { margin: 14px 0 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 16px 16px; }
.f-where { display: flex; align-items: baseline; gap: 12px; }
.f-num { font-family: var(--serif); font-weight: 700; font-size: 40px; line-height: 1; color: var(--wine); }
.f-set { font-size: 15px; color: var(--muted); }
.f-set b { color: var(--ink); font-weight: 700; }
.f-partner { margin: 6px 0 0; font-size: 14px; color: var(--faint); }
.f-card h2 { margin: 10px 0 0; font-size: 24px; line-height: 1.2; font-weight: 700; }
.f-card h2 a { text-decoration: underline; text-decoration-color: var(--gold-line); text-underline-offset: 3px; text-decoration-thickness: 1px; }
.f-warm { margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--gold-soft); border-left: 3px solid var(--gold-line); font-size: 15px; }
.f-target { margin: 12px 0 0; font-size: 15px; color: var(--muted); }
.f-target strong { font-size: 22px; color: var(--ink); font-weight: 700; margin-right: 6px; }
.f-cue { margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); font-size: 15px; color: var(--muted); }
.f-cue b { color: var(--ink); font-weight: 600; }
.f-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0 0; }
.f-fields.one { grid-template-columns: 1fr; }
.f-field label { display: block; font-size: 13px; color: var(--faint); margin: 0 0 4px; }
.f-step { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.f-step:focus-within { border-color: var(--rose); }
.f-pm { height: 58px; border: 0; background: var(--surface-2); font-size: 26px; font-weight: 600; color: var(--wine); cursor: pointer; padding: 0; }
.f-input { width: 100%; min-width: 0; border: 0; background: transparent; text-align: center; font-size: 28px; font-weight: 700; padding: 8px 0; outline: none; }
.f-input::placeholder { color: var(--faint); font-weight: 500; opacity: 1; }
.f-done { width: 100%; margin: 16px 0 0; min-height: 58px; border: 0; border-radius: 14px; background: var(--wine); color: var(--surface); font-size: 18px; font-weight: 700; cursor: pointer; }
.f-nav { display: flex; justify-content: space-between; margin: 10px 0 0; }
.f-donecard { margin: 14px 0 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px 16px; }
.f-donecard h2 { margin: 0; font-family: var(--serif); font-size: 28px; color: var(--wine); }
.f-donecard p { margin: 8px 0 0; color: var(--muted); }
.rest { margin: 14px 0 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px 16px 18px; text-align: center; }
.rest-label { margin: 0; font-size: 15px; color: var(--muted); font-weight: 600; }
.rest-time { font-family: var(--serif); font-weight: 700; font-size: 84px; line-height: 1; color: var(--wine); margin: 8px 0 14px; }
.rest-why { margin: 12px 0 0; color: var(--muted); font-size: 15px; }
.rest-logged { margin: 8px 0 0; color: var(--ink); font-size: 14px; }
.rest-btns { flex-wrap: wrap; }
.rest-btns { display: flex; gap: 8px; justify-content: center; margin: 16px 0 0; }
.rest-btns button { min-height: 48px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 700; font-size: 16px; cursor: pointer; color: var(--ink); }
.rest-btns .primary { background: var(--wine); border-color: var(--wine); color: var(--surface); }
.rest-next { margin: 18px 0 0; padding: 12px; border-radius: 12px; background: var(--surface-2); text-align: left; font-size: 14px; color: var(--muted); }
.rest-next b { display: block; font-size: 17px; color: var(--ink); margin: 2px 0; }

@media (min-width: 600px) {
  .wo-head h1, .h-title { font-size: 34px; }
  .group { grid-template-columns: 58px 1fr; }
  .group-num { font-size: 46px; }
}

<body>
<header class="top">
  <div class="top-inner">
    <div class="top-row">
      <div class="date-nav">
        <button class="day-arrow" type="button" id="dayPrev" aria-label="Vorheriger Tag">‹</button>
        <button class="date-btn" type="button" id="dateBtn" aria-label="Datum wählen"><span id="dateLabel"></span><small id="dateSub"></small></button>
        <button class="day-arrow" type="button" id="dayNext" aria-label="Nächster Tag">›</button>
        <input type="date" id="dateInput" class="date-hidden" tabindex="-1" aria-hidden="true">
      </div>
      <nav class="tabs" aria-label="Ansicht">
        <button class="tab" type="button" data-view="heute">Training</button>

      if (slot.i === 'x') dd.extra = {}; else dd.sets[slot.i] = {};
      clearInterval(correctLoop); S.correcting = false; S.pausedNext = null; S.restUntil = null; S.lastTick = null; S.lastTickSlot = null;
      touch(200); saveTick(); render(); window.scrollTo(0, 0);
    });
  }

  if (slot.i === 0) {
    const cue = el('p', 'f-cue'); cue.appendChild(el('b', '', 'Worauf achten: ')); cue.appendChild(document.createTextNode(item.cue));
    card.appendChild(cue);
  } else {
    const det = el('details', 'f-cuedet');
    det.appendChild(el('summary', '', 'Worauf achten'));
    det.appendChild(el('p', 'f-cue', item.cue));
    card.appendChild(det);
  }
  card.appendChild(renderNotes(item, t, undoBtn));
  wrap.appendChild(card);
}

function renderRest(wrap, order) {
  const box = el('div', 'rest');
  box.appendChild(el('p', 'rest-label', 'Pause'));
  const tm = el('div', 'rest-time'); tm.id = 'restTime'; tm.setAttribute('role', 'timer'); box.appendChild(tm);
  const b = el('div', 'rest-bar'); const f = el('i'); f.id = 'restFill'; b.appendChild(f); box.appendChild(b);
  box.appendChild(el('p', 'rest-why', S.restReason));
  const prev = S.restFrom !== null ? order[S.restFrom] : null;
  if (prev && slotDone(prev)) {
    const pd = exData(prev.item, false);
    const row = pd ? (prev.i === 'x' ? pd.extra : pd.sets[prev.i]) : null;
    if (row) {
      const t = EX[prev.item.ex].t, k = prev.i === 'x' ? 'r' : mainKey(t);
      const unit = prev.i === 'x' ? ' Wdh.' : (t === 'time' ? ' s' : t === 'carry' ? ' m' : ' Wdh.');
      const wtxt = num(row.w) !== null ? fmtNum(num(row.w)) + ' kg' + (t === 'assist' && pd.mode !== 'zusatz' && prev.i !== 'x' ? ' Hilfe' : '') + ', ' : '';
      const rirTxt = typeof row.rir === 'number' ? ', Reserve ' + (row.rir === 3 ? '3+' : row.rir) : '';
      box.appendChild(el('p', 'rest-logged', 'Eingetragen: ' + prev.item.k + ' ' + exName(prev.item) + ', ' + setLabelOf(order, prev) + ': ' + wtxt + fmtNum(num(row[k])) + unit + rirTxt));
      box.appendChild(noteArea(prev.item, 'f-note rest-note'));
    }
  }
  const btns = el('div', 'rest-btns');
  if (prev) {
    const back = el('button', '', 'Zurück'); back.type = 'button';
    back.setAttribute('aria-label', 'Zurück zum letzten Satz, um ihn zu ändern');
    back.addEventListener('click', function () {
      S.correcting = true; S.correctAlerted = false; S.pausedNext = S.focusIdx; S.focusIdx = S.restFrom;
      saveTick(); render(); window.scrollTo(0, 0);
    });
    btns.appendChild(back);
  }
  const more = el('button', '', '+30 s'); more.type = 'button';
  more.addEventListener('click', function () { S.restUntil += 30000; S.restTotal += 30; saveTick(); drawRest(); });
  const end = el('button', 'primary', 'Pause beenden'); end.type = 'button';
  end.addEventListener('click', function () { S.restUntil = null; saveTick(); render(); window.scrollTo(0, 0); });
  btns.appendChild(more); btns.appendChild(end); box.appendChild(btns);
  const next = order[S.focusIdx];
  if (next) {
    const pv = el('div', 'rest-next');
    pv.appendChild(el('span', '', 'Als Nächstes'));
    pv.appendChild(el('b', '', next.item.k + ' ' + exName(next.item)));
    let info = setLabelOf(order, next) + ', Ziel ' + (next.i === 'x' ? 'Extrasatz links' : targetOf(next.item));
    const sg = suggestion(next.item);
    const w = next.i === 'x' ? placeholderFor(next.item, 'x', sg, 'w') : (sg.next ? fmtNum(sg.next) : (sg.w !== null && sg.w !== undefined ? fmtNum(sg.w) : ''));
    if (w && (EX[next.item.ex].t === 'wr' || EX[next.item.ex].t === 'carry')) info += ', ' + w + ' kg';
    pv.appendChild(el('span', '', info));
    const nc = el('p', 'f-cue'); nc.style.margin = '10px 0 0'; nc.style.padding = '0'; nc.style.background = 'none';
    nc.appendChild(el('b', '', 'Worauf achten: ')); nc.appendChild(document.createTextNode(next.item.cue));
    pv.appendChild(nc);
    box.appendChild(pv);
  }
  wrap.appendChild(box);
  drawRest();
}

function renderOpen(wrap, order) {
  const open = order.map(function (x, n) { return { x: x, n: n }; }).filter(function (o) { return !slotDone(o.x); });
  if (!open.length) { S.showOpen = false; renderFocusDone(wrap, order.length); return; }
  const c = el('div', 'f-donecard');
  c.appendChild(el('h2', '', open.length === 1 ? 'Ein Satz ist noch offen' : open.length + ' Sätze sind noch offen'));
  c.appendChild(el('p', '', 'Tipp auf einen, um ihn jetzt zu machen.'));
  const ul = el('div', 'f-openlist');
  open.forEach(function (o) {
    const b = el('button', 'f-openitem'); b.type = 'button';
    b.appendChild(el('b', '', o.x.item.k + ' ' + exName(o.x.item)));
    b.appendChild(el('span', '', setLabelOf(order, o.x)));
    b.addEventListener('click', function () { S.showOpen = false; S.focusIdx = o.n; saveTick(); render(); window.scrollTo(0, 0); });
    ul.appendChild(b);
  });
  c.appendChild(ul);
  const back = el('button', 'linkish', 'Zurück zum letzten Satz'); back.type = 'button';
  back.addEventListener('click', function () { S.showOpen = false; S.focusIdx = order.length - 1; render(); window.scrollTo(0, 0); });
  c.appendChild(back);
  const leave = el('button', 'linkish', 'Für heute so lassen'); leave.type = 'button'; leave.style.marginLeft = '16px';
  leave.addEventListener('click', function () { S.showOpen = false; S.ui = 'liste'; try { localStorage.setItem(UI_KEY, 'liste'); } catch (err) { /* nichts */ } render(); window.scrollTo(0, 0); });
  c.appendChild(leave);
  wrap.appendChild(c);
}
function renderFocusDone(wrap, total) {
  releaseWake();
  const c = el('div', 'f-donecard');
  c.appendChild(el('h2', '', 'Einheit geschafft'));
  c.appendChild(el('p', '', 'Alle ' + total + ' Sätze sind eingetragen und gespeichert.'));
  const b = el('button', 'linkish', 'In der Liste ansehen'); b.type = 'button';
  b.addEventListener('click', function () { S.ui = 'liste'; try { localStorage.setItem(UI_KEY, 'liste'); } catch (err) { /* nichts */ } render(); window.scrollTo(0, 0); });
  c.appendChild(b);
  wrap.appendChild(c);
}

const ICON_LIST = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1" fill="currentColor"/><circle cx="4.5" cy="12" r="1" fill="currentColor"/><circle cx="4.5" cy="18" r="1" fill="currentColor"/></svg>';
const ICON_STEP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="M10 9l3 3-3 3"/></svg>';
const ICON_UNDO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>';
const ICON_CLOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4h4"/><path d="M12 7v5l3 2"/></svg>';
/* Notiz direkt beschreibbar, darunter ⚡ für „Hat gezwickt“ und ein Symbol für den Verlauf */
function noteArea(item, cls) {
  const d = exData(item, false);
  const ta = el('textarea', cls);
  ta.rows = 2;
  ta.placeholder = 'Notiz zu ' + exName(item);
  ta.setAttribute('aria-label', 'Notiz zu ' + exName(item));
  ta.value = d && d.note ? d.note : '';
  const grow = function () { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight + 2, 240) + 'px'; };
  ta.addEventListener('input', function () { const dd = exData(item, true); dd.note = ta.value; touch(1500); grow(); });
  ta.addEventListener('change', function () { flush(sid(S.date, S.wid)); });
  setTimeout(grow, 0);
  return ta;
}
function renderNotes(item, t, undoBtn) {
  const box = el('div', 'f-notes');
  const prev = shownEntry(item);
  if (prev && prev.data.note) {
    const ln = el('p', 'f-lastnote', 'Notiz vom ' + fmtDay(prev.date) + ': ' + prev.data.note);
    ln.title = 'Antippen zum Aufklappen';
    ln.addEventListener('click', function () { ln.classList.toggle('open'); });
    box.appendChild(ln);
  }
  box.appendChild(noteArea(item, 'f-note'));
  const icons = el('div', 'f-icons');
  const d = exData(item, false);
  const pain = el('button', 'f-icon f-icon-pain', '⚡'); pain.type = 'button';
  const setPain = function (on) { pain.setAttribute('aria-pressed', String(on)); pain.setAttribute('aria-label', on ? 'Hat gezwickt, markiert' : 'Hat gezwickt markieren'); pain.title = on ? 'Hat gezwickt (markiert)' : 'Hat gezwickt'; };
  setPain(!!(d && d.pain));
  pain.addEventListener('click', function () { const dd = exData(item, true); dd.pain = !dd.pain; touch(200); setPain(dd.pain); });
  const hist = el('button', 'f-icon'); hist.type = 'button'; hist.innerHTML = ICON_CLOCK;
  hist.setAttribute('aria-label', 'Verlauf dieser Übung'); hist.title = 'Verlauf'; hist.setAttribute('aria-expanded', 'false');
  const panel = el('div', 'f-hist'); panel.hidden = true;
  const list = entriesFor(item.ex).slice(0, 8);
  if (list.length) {
    const ul = el('ul', 'hist');
    list.forEach(function (x) {
      const li = el('li');
      li.appendChild(document.createTextNode(fmtDay(x.date) + (x.deload ? ' (Entlastung)' : '') + ': '));
      const wtx = weightText(x.data, t);
      li.appendChild(el('b', '', (wtx ? wtx + ', ' : '') + setsText(x.data, t, item.side)));
      if (x.data.pain) li.appendChild(document.createTextNode(' (gezwickt)'));
      if (x.data.note) li.appendChild(el('span', 'hist-note', x.data.note));
      ul.appendChild(li);
    });
    panel.appendChild(ul);
  } else panel.appendChild(el('p', 'lastnote', 'Noch keine früheren Einträge.'));
  hist.addEventListener('click', function () { panel.hidden = !panel.hidden; hist.setAttribute('aria-expanded', String(!panel.hidden)); });
  icons.appendChild(pain); icons.appendChild(hist);
  if (undoBtn) icons.appendChild(undoBtn);
  box.appendChild(icons);
  box.appendChild(panel);
  return box;
}
function painButton(item) {
  const d = exData(item, false);
  const on = !!(d && d.pain);
  const b = el('button', 'linkish pain', on ? 'Hat gezwickt: markiert' : 'Hat gezwickt');
  b.type = 'button';
  b.setAttribute('aria-pressed', String(on));
  b.addEventListener('click', function () {
    const dd = exData(item, true);
    dd.pain = !dd.pain;
    touch(200);
    b.setAttribute('aria-pressed', String(dd.pain));
    b.textContent = dd.pain ? 'Hat gezwickt: markiert' : 'Hat gezwickt';
  });
  return b;
}
function renderMore(item, t) {
  const det = el('details', 'more');
  const sum = el('summary', '', 'Notiz und Verlauf');
  det.appendChild(sum);
  const d = exData(item, false);
  const prev = lastEntry(item.ex);
  if (prev && prev.data.note) det.appendChild(el('p', 'lastnote', 'Notiz vom ' + fmtDay(prev.date) + ': ' + prev.data.note));
  if (prev && prev.data.note && !det.open) { sum.textContent = 'Notiz und Verlauf (letzte Notiz vorhanden)'; }
  const ta = el('textarea');
  ta.placeholder = 'Notiz für heute, zum Beispiel wie es sich angefühlt hat';
  ta.setAttribute('aria-label', 'Notiz zu ' + exName(item));
  ta.value = d && d.note ? d.note : '';
  ta.addEventListener('input', function () { const dd = exData(item, true); dd.note = ta.value; touch(1500); });
  ta.addEventListener('change', function () { flush(sid(S.date, S.wid)); });
  det.appendChild(ta);
  const list = entriesFor(item.ex).slice(0, 6);
  if (list.length) {
    const ul = el('ul', 'hist');
    list.forEach(function (x) {
      const li = el('li');
      li.appendChild(document.createTextNode(fmtDay(x.date) + (x.deload ? ' (Entlastung)' : '') + ': '));
      const wtx = weightText(x.data, t);
      li.appendChild(el('b', '', (wtx ? wtx + ', ' : '') + setsText(x.data, t, item.side)));
      if (x.data.pain) li.appendChild(document.createTextNode(' (gezwickt)'));
      ul.appendChild(li);
    });
    det.appendChild(ul);
  } else det.appendChild(el('p', 'lastnote', 'Noch keine früheren Einträge.'));
  return det;
}

/* Fußleiste */
let tickTimer = null;
function updateNext() {
  const bar = document.getElementById('nextBar');
  document.querySelectorAll('.set.next').forEach(function (n) { n.classList.remove('next'); });
  if (S.view !== 'heute' || !S.wid || S.ui === 'schritt') { bar.hidden = true; clearInterval(tickTimer); return; }
  const wo = WO[S.wid];
  const order = slotOrder(wo);
  const next = order.find(function (s) { return !slotDone(s); });
  bar.hidden = false;
  const what = document.getElementById('nextWhat'), rest = document.getElementById('nextRest'), label = document.getElementById('nextLabel');
  if (!next) {
    S.lastTick = null; S.lastTickSlot = null;
    label.textContent = 'Fertig';
    what.textContent = 'Alle Sätze erledigt';
    rest.textContent = 'Wird automatisch gespeichert';
    S.nextSlot = null;
  } else {
    S.nextSlot = next;
    const row = document.querySelector('.set[data-ex="' + next.item.ex + '"][data-i="' + next.i + '"]');
    if (row) row.classList.add('next');
    label.textContent = 'Als Nächstes';
    const setLabel = next.i === 'x' ? 'Extrasatz links' : 'Satz ' + (next.i + 1);
    what.textContent = next.item.k + ' ' + exName(next.item) + ', ' + setLabel;
    let r = '';
    const lt = S.lastTickSlot;
    if (lt) {
      const g = next.item.k.replace(/[a-z]/g, '');
      if (lt.ex === next.item.ex) r = 'Pause 2–3 Minuten';
      else if (lt.g === g) r = 'Pause gut 1 Minute';
      else r = 'Neuer Block, kurz einrichten';
    } else r = 'Ziel: ' + next.item.reps + (EX[next.item.ex].t === 'time' ? ' s' : EX[next.item.ex].t === 'carry' ? ' m' : '');
    rest.textContent = r;
  }
  clearInterval(tickTimer);
  const timer = document.getElementById('timer');
  const draw = function () {
    if (!S.lastTick) { timer.textContent = ''; return; }
    const sec = Math.floor((Date.now() - S.lastTick) / 1000);
    /* Länger als 10 Minuten ist keine Satzpause mehr: Uhr ausblenden */
    if (sec > MAX_PAUSE_SEC) { timer.textContent = ''; S.lastTick = null; S.lastTickSlot = null; clearInterval(tickTimer); return; }
    timer.textContent = Math.floor(sec / 60) + ':' + pad(sec % 60);
  };
  timer.textContent = '';
}
document.getElementById('nextBtn').addEventListener('click', function () {
  if (!S.nextSlot) return;
  const row = document.querySelector('.set[data-ex="' + S.nextSlot.item.ex + '"][data-i="' + S.nextSlot.i + '"]');
  if (row) row.scrollIntoView({ block: 'center', behavior: 'smooth' });
});

/* Verlauf */
function renderHistory(app) {
  app.appendChild(el('h1', 'h-title', 'Verlauf'));
  app.appendChild(statusEl());
  const list = Object.keys(S.sessions).map(function (id) { return Object.assign({ id: id }, S.sessions[id]); })
    .filter(function (s) {
      return s && s.w && WO[s.w] && Object.keys(s.ex || {}).some(function (k) { return EX[k] && loggedSets(s.ex[k], EX[k].t).length; });
    })
    .sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : (b.upd || 0) - (a.upd || 0); });
  if (!list.length) {
    app.appendChild(el('p', 'h-empty', S.loaded ? 'Noch keine Einheit eingetragen. Unter „Training“ trägst du die erste ein.' : 'Lädt …'));
    renderBackup(app);
    return;
  }
  let month = '';
  list.forEach(function (s) {
    const d = parseDate(s.date);
    const m = MON_LONG[d.getMonth()] + ' ' + d.getFullYear();
    if (m !== month) { month = m; app.appendChild(el('h2', 'h-month', m)); }
    const det = el('details', 'h-item');
    const sum = el('summary');
    const left = el('div');
    left.appendChild(el('b', '', WO[s.w].name));
    left.appendChild(document.createElement('br'));
    left.appendChild(el('span', '', WD_LONG[d.getDay()] + ', ' + d.getDate() + '. ' + MON[d.getMonth()] + (s.deload ? ', Entlastung' : '')));
    sum.appendChild(left);
    let done = 0;
    Object.keys(s.ex || {}).forEach(function (k) { if (EX[k]) done += loggedSets(s.ex[k], EX[k].t).length; });
    sum.appendChild(el('span', '', done + (done === 1 ? ' Satz' : ' Sätze')));
    det.appendChild(sum);
    const body = el('div', 'h-body');
    WO[s.w].list.forEach(function (item) {
      const data = s.ex && s.ex[item.ex];
      if (!data || !loggedSets(data, EX[item.ex].t).length) return;
      const p = el('p');
      p.appendChild(document.createTextNode(item.k + ' ' + exName(item) + ': '));
      const wtx = weightText(data, EX[item.ex].t);
      p.appendChild(el('b', '', (wtx ? wtx + ', ' : '') + setsText(data, EX[item.ex].t, item.side)));
      if (data.pain) p.appendChild(document.createTextNode(' (gezwickt)'));
      body.appendChild(p);
      if (data.note) body.appendChild(el('p', '', 'Notiz: ' + data.note));
    });
    Object.keys(s.ex || {}).forEach(function (k) {
      if (!EX[k] || WO[s.w].list.some(function (it) { return it.ex === k; })) return;
      const data = s.ex[k];
      if (!loggedSets(data, EX[k].t).length) return;
      const p = el('p');
      p.appendChild(document.createTextNode(EX[k].n + ' (nicht mehr im Plan): '));
      const wtx = weightText(data, EX[k].t);
      p.appendChild(el('b', '', (wtx ? wtx + ', ' : '') + setsText(data, EX[k].t, false)));
      body.appendChild(p);
      if (data.note) body.appendChild(el('p', '', 'Notiz: ' + data.note));
    });
    const open = el('button', 'linkish', 'Einheit öffnen');
    open.type = 'button';
    open.addEventListener('click', function () {
      S.date = s.date; S.wid = s.w; S.userPicked = true; S.view = 'heute'; resetFocus();
      setHash(''); render(); window.scrollTo(0, 0);
    });
    body.appendChild(open);
    det.appendChild(body);
    app.appendChild(det);
  });
  renderBackup(app);
}

/* Navigation */
function setHash(h) {
  try { if (h) location.hash = h; else history.replaceState(null, '', location.pathname + location.search); } catch (err) { /* nichts */ }
}
function fromHash() { S.view = location.hash === '#verlauf' ? 'verlauf' : (location.hash === '#gewicht' ? 'gewicht' : 'heute'); }
window.addEventListener('hashchange', function () { fromHash(); render(); });
document.querySelectorAll('.tab').forEach(function (b) {
  b.addEventListener('click', function () {
    S.view = b.dataset.view;
    setHash(S.view === 'heute' ? '' : S.view);
    render(); window.scrollTo(0, 0);
  });
});
function setDate(d) {
  if (!d || d === S.date) return;
  Object.keys(dirty).forEach(function (id) { if (dirty[id]) flush(id); });
  S.date = d; S.wid = null; S.userPicked = false; resetFocus();
  if (S.view === 'verlauf') { S.view = 'heute'; setHash(''); }
  render(); window.scrollTo(0, 0);
}
document.getElementById('dateInput').addEventListener('change', function (ev) { setDate(ev.target.value); });
document.getElementById('dateBtn').addEventListener('click', function () {
  const inp = document.getElementById('dateInput');
  inp.value = S.date;
  if (typeof inp.showPicker === 'function') { try { inp.showPicker(); return; } catch (err) { /* weiter unten */ } }
  inp.focus(); inp.click();
});
document.getElementById('dayPrev').addEventListener('click', function () { setDate(addDays(S.date, -1)); });
document.getElementById('dayNext').addEventListener('click', function () { setDate(addDays(S.date, 1)); });
window.addEventListener('resize', function () { renderTop(); });

fromHash();
render();
initStore();
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(function () { /* ohne sw.js läuft die Seite normal weiter */ });
}

window.__tb = { chooseWorkout: chooseWorkout, refEntry: refEntry, S: S, WO: WO, EX: EX, suggestion: suggestion, slotOrder: slotOrder, stallInfo: stallInfo, render: render, restPlan: restPlan };
})();
</script>
